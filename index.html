</head><body>
<main class="card" id="auth">

<div id="reg" class="hide">

<label for="r-pass">Kata sandi</label><div class="f"><input id="r-pass" type="password" placeholder="Minimal 8 karakter"><button class="eye" type="button" data-eye="r-pass">Lihat</button></div>
<label for="r-conf">Konfirmasi kata sandi</label><div class="f"><input id="r-conf" type="password" placeholder="Ketik ulang kata sandi"><button class="eye" type="button" data-eye="r-conf">Lihat</button></div>

<label for="o-code">Kode verifikasi</label><input id="o-code" inputmode="numeric" placeholder="Masukkan kode dari email">

<div id="forgot" class="hide">

<div class="msg" id="f-msg"></div><button class="go" id="do-forgot" type="button">Kirim tautan reset</button></div>
<button class="link back hide" id="back" type="button">Kembali ke halaman masuk</button>

</main>

<button class="ib" id="more" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></div></header>

<div class="idsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="idq" type="search" inputmode="numeric" maxlength="7" placeholder="Cari ID pengguna" autocomplete="off"></div></header>

<div class="chd"><span class="av" id="chav"></span><div class="chn"><b id="chname"></b><small id="chid"></small></div></div></header>
<div class="cmsgs" id="cmsgs"></div>
<div class="cbar" id="cbar"><div class="cnorm"><textarea id="cinp" rows="1" maxlength="500" placeholder="Tulis pesan"></textarea>
<button class="send hide" id="sendc" type="button" aria-label="Kirim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button><button class="send" id="micc" type="button" aria-label="Rekam pesan suara"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div>
<div class="recbar" id="recbar"><button class="ib" id="recx" type="button" aria-label="Batalkan rekaman"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button><span class="recdot"></span><span class="rt" id="rect">0:00</span><span class="sl hint">Merekam pesan suara...</span><button class="send" id="recsend" type="button" aria-label="Kirim pesan suara"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button></div></div>
</section>

<div class="ov mid" id="dov"><div class="dlg"><div class="dh"><b id="dt"></b><button class="x" id="dx" type="button" aria-label="Tutup">×</button></div><div id="dbody"></div></div></div>

<script>
const sb=supabase.createClient('https://fdzaetvufnmjiirgdgib.supabase.co','sb_publishable_ULwYUpU1qlrcbKu8LGOEhg_-53y8FvF');
const $=i=>document.getElementById(i);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const av=n=>el('span','av',((n||'?')[0]).toUpperCase());
const say=(id,t,c)=>{$(id).textContent=t||'';$(id).className='msg '+(c||'')};
const tr=e=>{const m=(e&&e.message)||String(e);return /Invalid login/i.test(m)?'Email atau kata sandi salah':/not confirmed/i.test(m)?'Email belum diverifikasi':/rate limit/i.test(m)?'Terlalu sering mencoba, tunggu sebentar':/already registered/i.test(m)?'Email sudah terdaftar':m};
const setTheme=(t,keep)=>{document.documentElement.dataset.theme=t;if(keep){try{localStorage.setItem('sena-theme',t)}catch(e){}}};
const savedTheme=()=>{try{return localStorage.getItem('sena-theme')==='dark'?'dark':'light'}catch(e){return'light'}};
setTheme('light');
let me=null,prof=null,poll=null,curCid=null,curLoad=null,rec=null,adding=false;
const PAGES=['v-load','v-home','v-add','v-chat'];
function show(id){clearInterval(poll);PAGES.forEach(x=>$(x).classList.add('hide'));$('auth').classList.toggle('hide',id!=='auth');document.body.classList.toggle('app',id!=='auth');if(id!=='auth')$(id).classList.remove('hide');window.scrollTo(0,0)}

/* ---- auth ---- */
function view(v){['login','reg','otp','forgot'].forEach(x=>$(x).classList.toggle('hide',x!==v));
  const t=v==='login'||v==='reg';$('tabs').classList.toggle('hide',!t);$('back').classList.toggle('hide',t);
  $('t-login').setAttribute('aria-selected',v==='login');$('t-reg').setAttribute('aria-selected',v==='reg');
  const T={login:['Masuk ke akunmu','Pakai email yang sudah terdaftar.'],reg:['Buat akun baru','Isi data di bawah untuk mulai memakai Sena.'],otp:['Verifikasi email','Masukkan kode yang dikirim ke emailmu.'],forgot:['Lupa password','Kami kirim tautan untuk membuat password baru.']}[v];
  $('ttl').textContent=T[0];$('sub').textContent=T[1]}
$('t-login').onclick=()=>view('login');$('t-reg').onclick=()=>view('reg');
$('to-forgot').onclick=()=>view('forgot');$('back').onclick=()=>view('login');
document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=$(b.dataset.eye),h=i.type==='password';i.type=h?'text':'password';b.textContent=h?'Sembunyi':'Lihat'});
$('do-login').onclick=async()=>{say('l-msg','Memproses…');const{error}=await sb.auth.signInWithPassword({email:$('l-email').value.trim(),password:$('l-pass').value});say('l-msg',error?tr(error):'',error?'err':'')};
let pendMail='';
$('do-reg').onclick=async()=>{const u=$('r-user').value.trim(),e=$('r-email').value.trim(),p=$('r-pass').value;
  if(u.length<3)return say('r-msg','Username minimal 3 karakter','err');if(!/^\S+@\S+\.\S+$/.test(e))return say('r-msg','Email tidak valid','err');
  if(p.length<8)return say('r-msg','Kata sandi minimal 8 karakter','err');if(p!==$('r-conf').value)return say('r-msg','Konfirmasi kata sandi tidak sama','err');
  say('r-msg','Membuat akun…');const{data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{username:u}}});
  if(error)return say('r-msg',tr(error),'err');say('r-msg','');
  if(!data.session){pendMail=e;$('otp-note').textContent='Kode verifikasi dikirim ke '+e+'. Cek inbox atau folder spam.';view('otp')}};
$('do-otp').onclick=async()=>{say('o-msg','Memeriksa…');const{error}=await sb.auth.verifyOtp({email:pendMail,token:$('o-code').value.trim(),type:'signup'});say('o-msg',error?tr(error):'',error?'err':'')};
$('do-forgot').onclick=async()=>{const e=$('f-email').value.trim();if(!e)return say('f-msg','Isi emailmu dulu','err');
  const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});say('f-msg',error?tr(error):'Tautan reset dikirim. Cek emailmu.',error?'err':'ok')};

/* ---- masuk ke aplikasi ---- */
async function boot(){
  const{data}=await sb.from('profiles').select('*').eq('id',me).maybeSingle();prof=data||{username:'Pengguna',uid7:'-'};setTheme(savedTheme());adding=false;$('cancel-add').classList.add('hide');sb.auth.getSession().then(({data:{session}})=>{if(session)saveAcct(session,prof)});
  $('lname').textContent=prof.username;show('v-load');const t0=performance.now();
  await new Promise(r=>{const f=n=>{const p=Math.min(1,(n-t0)/1500);$('barfill').style.width=p*100+'%';$('pct').textContent=Math.round(p*100)+'%';p<1?requestAnimationFrame(f):r()};requestAnimationFrame(f)});
  home()}
const ft=d=>{const x=new Date(d),n=new Date();return x.toDateString()===n.toDateString()?x.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):x.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit'})};
async function list(){
  const{data:fs}=await sb.from('friendships').select('user_a,user_b');const ids=(fs||[]).map(x=>x.user_a===me?x.user_b:x.user_a);
  const F=document.createDocumentFragment();
  if(!ids.length)F.append(el('p','sub','Belum ada teman. Ketuk tombol + untuk menambah teman lewat ID.'));
  else{
    const{data:ps}=await sb.from('profiles').select('id,username,uid7').in('id',ids);
    const{data:ms}=await sb.from('conversation_members').select('conv_id,last_read_at').eq('user_id',me);
    const cids=(ms||[]).map(x=>x.conv_id),info={},rd={},byC={};
    (ms||[]).forEach(x=>rd[x.conv_id]=x.last_read_at);
    if(cids.length){
      const{data:om}=await sb.from('conversation_members').select('conv_id,user_id').in('conv_id',cids).neq('user_id',me);
      const{data:lm}=await sb.from('messages').select('conv_id,sender_id,kind,body,deleted,created_at').in('conv_id',cids).order('created_at',{ascending:false}).limit(300);
      (om||[]).forEach(x=>{info[x.user_id]={unread:0};byC[x.conv_id]=x.user_id});
      (lm||[]).forEach(m=>{const u=byC[m.conv_id];if(!u)return;const i=info[u];if(!i.last)i.last=m;if(m.sender_id!==me&&m.kind!=='system'&&m.created_at>rd[m.conv_id])i.unread++});
    }
    (ps||[]).sort((a,b)=>((info[b.id]||{}).last?info[b.id].last.created_at:'')>((info[a.id]||{}).last?info[a.id].last.created_at:'')?1:-1).forEach(p=>{
      const i=info[p.id]||{unread:0},m=i.last,b=el('button','arow crow'),t=el('span','it'),c=el('span','ct');b.type='button';
      const pv=!m?'ID '+p.uid7:m.deleted?'Pesan dihapus':(m.sender_id===me?'Kamu: ':'')+(m.kind==='text'||m.kind==='system'?m.body:m.kind==='voice'?'🎤 Pesan suara':'['+m.kind+']');
      t.append(el('b','',p.username),el('small','',pv));
      if(m)c.append(el('span','',ft(m.created_at)));if(i.unread)c.append(el('span','cb',i.unread>99?'99+':i.unread));
      b.append(av(p.username),t,c);b.onclick=()=>openChat(p);F.append(b)});
  }
  $('chatlist').replaceChildren(F);dot()}
async function home(){
  show('v-home');const j=new Date().getHours();
  $('gword').textContent=j>=4&&j<11?'pagi':j>=11&&j<15?'siang':j>=15&&j<18?'sore':'malam';$('gname').textContent=prof.username;
  await list();poll=setInterval(list,5000)}
async function dot(){const{count}=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('read',false);$('mdot').classList.toggle('hide',!count)}

/* ---- dialog: notifikasi & akun ---- */
function dlg(title,fill){$('dt').textContent=title;const b=$('dbody');b.innerHTML='';fill(b);$('dov').classList.add('open')}
$('dx').onclick=()=>{$('dov').classList.remove('open');dot()};
async function notif(b){
  const{data}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(30);
  b.innerHTML='';if(!data||!data.length)b.append(el('p','sub','Belum ada notifikasi'));
  const L=el('div','alist');
  (data||[]).forEach(n=>{const c=el('div','rcard'),m=el('div','meta');m.append(el('b','',n.title),el('small','',n.body));c.append(m);
    if(n.type==='friend_request'&&n.data&&n.data.request_id&&!n.read){const a=el('div','racts'),ok=el('button','sb addf','Terima'),no=el('button','sb','Tolak');
      const go=async v=>{const{error}=await sb.rpc('respond_friend_request',{req:n.data.request_id,accept:v});if(error)return alert(error.message);await sb.from('notifications').update({read:true}).eq('id',n.id);notif(b);home()};
      ok.onclick=()=>go(true);no.onclick=()=>go(false);a.append(ok,no);c.append(a)}
    L.append(c)});b.append(L);
  sb.from('notifications').update({read:true}).neq('type','friend_request').eq('user_id',me).then(()=>{})}
$('mail').onclick=()=>dlg('Notifikasi',notif);
$('more').onclick=()=>dlg('Akun',b=>{const o=el('button','sb out','Log out akun');o.onclick=()=>{$('dov').classList.remove('open');putAccts(getAccts().filter(x=>x.id!==me));sb.auth.signOut()};const sw=el('button','sb','Beralih ke akun lain');sw.onclick=()=>dlg('Beralih akun',acctList);
  const sg=el('div','seg');['light','Cerah','dark','Hitam'].forEach((v,i,a)=>{if(i%2)return;const k=el('button','',a[i+1]);k.type='button';k.setAttribute('aria-pressed',document.documentElement.dataset.theme===v);k.onclick=()=>{setTheme(v,1);sg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===k))};sg.append(k)});
  b.append(av(prof.username),el('p','sl','Username'),el('p','dp',prof.username),el('p','sl','ID kamu (bagikan ke teman)'),el('div','uid',prof.uid7),el('p','sl','Tampilan'),sg,sw,o)});

/* ---- tambah teman ---- */
$('fab').onclick=()=>{show('v-add');$('idq').value='';$('res').innerHTML='';$('res').append(el('p','sl','Masukkan 7 digit ID temanmu untuk menambahkannya.'))};
$('addback').onclick=home;
$('idq').oninput=async()=>{const q=$('idq'),v=q.value.replace(/\D/g,'');q.value=v;const box=$('res');box.innerHTML='';if(!v)return;
  const p=el('p','sl');box.append(p);if(v.length<7){p.textContent='ID terdiri dari 7 digit ('+v.length+'/7).';return}
  const{data:t}=await sb.from('profiles').select('id,username,uid7').eq('uid7',v).maybeSingle();
  if(!t){p.textContent='ID '+v+' tidak ditemukan.';return}if(t.id===me){p.textContent='Itu ID kamu sendiri.';return}
  box.innerHTML='';const c=el('div','rcard'),m=el('div','meta'),a=el('div','racts'),b=el('button','sb addf','Tambah teman');
  m.append(el('b','',t.username),el('small','','ID '+t.uid7));
  b.onclick=async()=>{b.disabled=true;const{error}=await sb.rpc('send_friend_request',{target:t.id});b.textContent=error?error.message:'Permintaan terkirim';if(error)b.disabled=false};
  a.append(b);c.append(av(t.username),m,a);box.append(c)};

/* ---- chat ---- */
async function openChat(p){
  const{data:cid,error}=await sb.rpc('get_or_create_dm',{other:p.id});if(error)return alert(error.message);
  show('v-chat');$('chav').textContent=p.username[0].toUpperCase();$('chname').textContent=p.username;$('chid').textContent='ID '+p.uid7;
  curCid=cid;$('cbar').classList.remove('rec');const box=$('cmsgs'),inp=$('cinp');box.innerHTML='';inp.value='';sync();let last='';
  const load=async()=>{
    const{data:cm}=await sb.from('conversation_members').select('cleared_at').eq('conv_id',cid).eq('user_id',me).maybeSingle();
    const{data:hs}=await sb.from('message_hides').select('message_id');const hid=new Set((hs||[]).map(x=>x.message_id));
    const{data}=await sb.from('messages').select('*').eq('conv_id',cid).gt('created_at',cm?cm.cleared_at:'1970-01-01').order('created_at').limit(200);
    const list=(data||[]).filter(m=>!hid.has(m.id)),sig=list.map(m=>m.id+m.deleted).join();if(sig===last)return;last=sig;box.innerHTML='';
    list.forEach(m=>{const sys=m.kind==='system',d=el('div','bub'+(m.sender_id===me?' me':'')+(sys?' sys':'')+(m.deleted?' del':''));
      if(m.kind==='voice'&&!m.deleted){d.classList.add('media');d.append(vnEl(m))}else d.append(el('span','bt',m.deleted?'Pesan dihapus':(m.kind==='text'||sys?m.body:'['+m.kind+' belum didukung]')));
      if(!sys&&!m.deleted){d.style.cursor='pointer';d.onclick=()=>dlg('Pesan',b=>{
        const e=el('div','msg'),h=el('button','sb','Hapus untuk saya'),a=el('button','sb danger','Hapus untuk semua orang');
        h.onclick=async()=>{const{error}=await sb.from('message_hides').insert({user_id:me,message_id:m.id});if(error)return e.textContent=error.message;$('dov').classList.remove('open');last='';load()};
        a.onclick=async()=>{const{data:pth,error}=await sb.rpc('delete_message_for_all',{m:m.id});if(error)return e.textContent=error.message;if(pth)sb.storage.from('media').remove([pth]);$('dov').classList.remove('open');last='';load()};
        b.append(el('p','dp',m.kind==='voice'?'Pesan suara':(m.body||'['+m.kind+']')));if(m.sender_id===me)b.append(a);b.append(h,e)})}
            if(!sys)d.append(el('small','',new Date(m.created_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})));box.append(d)});
    box.scrollTop=box.scrollHeight;sb.rpc('mark_read',{c:cid})};
  const send=async()=>{const t=inp.value.trim();if(!t)return;inp.value='';sync();
    const{error}=await sb.from('messages').insert({conv_id:cid,sender_id:me,kind:'text',body:t});if(error)alert(error.message);load()};
  $('sendc').onclick=send;inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
  curLoad=load;await load();poll=setInterval(load,3000)}
$('chback').onclick=()=>{stopRec(false);home()};


/* ---- pesan suara ---- */
const fmtDur=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
function sync(){const h=$('cinp').value.trim().length>0;$('sendc').classList.toggle('hide',!h);$('micc').classList.toggle('hide',h)}
$('cinp').addEventListener('input',sync);
function vnEl(m){const w=el('div','mblk vn'),b=el('button','vnb'),bar=el('div','vnbar'),f=el('i'),t=el('span','vnt',fmtDur(m.duration||0));b.type='button';
  const P='<path d="M7 4v16l13-8z" fill="currentColor"/>',S='<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>';
  const ic=p=>{b.innerHTML='<svg viewBox="0 0 24 24">'+p+'</svg>'};ic(P);bar.append(f);w.append(b,bar,t);let a=null;
  b.onclick=async e=>{e.stopPropagation();if(a&&!a.paused){a.pause();return}
    if(!a){const{data,error}=await sb.storage.from('media').createSignedUrl(m.media_path,3600);if(error)return alert(error.message);
      a=new Audio(data.signedUrl);a.ontimeupdate=()=>{const d=m.duration||a.duration;f.style.width=(d?Math.min(100,a.currentTime/d*100):0)+'%';t.textContent=fmtDur(Math.floor(a.currentTime))};
      a.onended=()=>{ic(P);f.style.width='0';t.textContent=fmtDur(m.duration||0)};a.onpause=()=>ic(P);a.onplay=()=>ic(S)}
    a.play().catch(x=>alert(x.message))};
  return w}
const pickMime=()=>{for(const c of['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'])if(window.MediaRecorder&&MediaRecorder.isTypeSupported(c))return c;return''};
async function startRec(){
  if(rec||!curCid)return;if(!navigator.mediaDevices||!window.MediaRecorder)return alert('Perekaman suara tidak didukung di browser ini.');
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return alert('Izin mikrofon ditolak. Izinkan mikrofon untuk situs ini di pengaturan browser.')}
  const mime=pickMime(),mr=mime?new MediaRecorder(st,{mimeType:mime}):new MediaRecorder(st),r={mr,ch:[],t0:Date.now(),cancel:false,mime:mr.mimeType||mime||'audio/webm',cid:curCid};rec=r;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)r.ch.push(e.data)};
  mr.onstop=async()=>{clearInterval(r.iv);st.getTracks().forEach(t=>t.stop());if(rec===r)rec=null;$('cbar').classList.remove('rec');
    const dur=Math.round((Date.now()-r.t0)/1000);if(r.cancel)return;if(dur<1||!r.ch.length)return alert('Pesan suara terlalu singkat.');
    const ext=/mp4/.test(r.mime)?'m4a':/ogg/.test(r.mime)?'ogg':'webm',path=r.cid+'/'+crypto.randomUUID()+'.'+ext;
    const up=await sb.storage.from('media').upload(path,new Blob(r.ch,{type:r.mime}),{contentType:r.mime.split(';')[0]});if(up.error)return alert('Gagal mengunggah: '+up.error.message);
    const{error}=await sb.from('messages').insert({conv_id:r.cid,sender_id:me,kind:'voice',media_path:path,duration:dur});if(error){sb.storage.from('media').remove([path]);return alert(error.message)}
    if(curCid===r.cid&&curLoad)curLoad()};
  mr.start(250);$('rect').textContent='0:00';$('cbar').classList.add('rec');
  r.iv=setInterval(()=>{const n=Math.floor((Date.now()-r.t0)/1000);$('rect').textContent=fmtDur(n);if(n>=180)stopRec(true)},250)}
function stopRec(send){if(!rec)return;rec.cancel=!send;try{rec.mr.stop()}catch(e){}}
$('micc').onclick=startRec;$('recx').onclick=()=>stopRec(false);$('recsend').onclick=()=>stopRec(true);

/* ---- beralih akun ---- */
const AK='sena-accounts';
const getAccts=()=>{try{return JSON.parse(localStorage.getItem(AK))||[]}catch(e){return[]}};
const putAccts=a=>{try{localStorage.setItem(AK,JSON.stringify(a))}catch(e){}};
function saveAcct(s,p){const a=getAccts(),i=a.findIndex(x=>x.id===s.user.id),o=i>=0?a[i]:{};
  const n={id:s.user.id,username:(p&&p.username)||o.username||'Akun',uid7:(p&&p.uid7)||o.uid7||'',at:s.access_token,rt:s.refresh_token};if(i>=0)a[i]=n;else a.push(n);putAccts(a)}
function acctList(b){b.append(el('p','sl','Akun yang sedang login'));
  getAccts().forEach(a=>{const r=el('button','arow crow'),t=el('span','it'),c=el('span','ct');r.type='button';t.append(el('b','',a.username),el('small','','ID '+a.uid7));if(a.id===me)c.append(el('span','','Aktif'));r.append(av(a.username),t,c);r.onclick=()=>{if(a.id!==me)switchTo(a)};b.append(r)});
  const add=el('button','sb','+ Tambahkan akun lain');add.onclick=startAdd;b.append(add)}
async function switchTo(a){const{error}=await sb.auth.setSession({access_token:a.at,refresh_token:a.rt});
  if(error){putAccts(getAccts().filter(x=>x.id!==a.id));$('dov').classList.remove('open');return alert('Sesi akun '+a.username+' sudah berakhir. Silakan masuk lagi lewat "+ Tambahkan akun lain".')}
  $('dov').classList.remove('open')}
function startAdd(){$('dov').classList.remove('open');adding=true;setTheme('light');show('auth');view('login');$('cancel-add').classList.remove('hide')}
$('cancel-add').onclick=()=>{adding=false;$('cancel-add').classList.add('hide');setTheme(savedTheme());home()};

sb.auth.onAuthStateChange((ev,s)=>{
  if(ev==='PASSWORD_RECOVERY')setTimeout(()=>{const p=prompt('Kata sandi baru (minimal 8 karakter):');if(p&&p.length>=8)sb.auth.updateUser({password:p}).then(r=>alert(r.error?r.error.message:'Kata sandi berhasil diubah'))},400);
  if(!s){me=null;prof=null;adding=false;$('cancel-add').classList.add('hide');setTheme('light');show('auth');view('login');return}
  if(ev==='TOKEN_REFRESHED'||ev==='SIGNED_IN')saveAcct(s,prof&&prof.id===s.user.id?prof:null);
  if(me!==s.user.id){me=s.user.id;setTimeout(boot,0)}else if(adding&&ev==='SIGNED_IN'){adding=false;$('cancel-add').classList.add('hide');setTimeout(home,0)}});
</script>

</body></html>
